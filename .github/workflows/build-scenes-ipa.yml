name: Build scenes IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - scenes

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift Package dependencies
        working-directory: src
        run: xcodebuild -resolvePackageDependencies -project Catty.xcodeproj -scheme "Catty (DEBUG)"

      - name: Build unsigned app for device
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild build \
            -project Catty.xcodeproj \
            -scheme "Catty (DEBUG)" \
            -sdk iphoneos \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | xcpretty || true

      - name: Locate built .app
        working-directory: src
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 2 -iname "*.app" -print -quit)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found — build failed. See log above."
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package IPA (Payload zip, unsigned)
        working-directory: src
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr Catty-scenes-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catty-scenes-unsigned-ipa
          path: src/Catty-scenes-unsigned.ipa
          retention-days: 14

      - name: Upload raw .app artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Catty-scenes-app
          path: src/build/Build/Products/Debug-iphoneos/*.app
          retention-days: 14
